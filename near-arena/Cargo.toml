[package]
name = "barrel-bay-arena"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib"]

[features]
# Exclusive to the separate judges contract. Never enable on the game ledger.
judges-demo = []

[dependencies]
near-sdk = "=5.30.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"
